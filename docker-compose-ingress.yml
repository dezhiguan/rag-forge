# Server 2 入口层：Nginx + RAGForge 前端静态资源（不含后端）
# CareerForge 前端由 CareerMate CI 同步到 frontend/dist/careerforge/
#
# 启动：docker compose -f docker-compose-ingress.yml up -d
services:
  nginx:
    image: nginx:alpine
    container_name: ragforge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - /data/ssl/ragforge:/etc/nginx/ssl/ragforge:ro
      - /data/ssl/careerforge:/etc/nginx/ssl/careerforge:ro
