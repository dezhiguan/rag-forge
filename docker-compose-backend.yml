# Server 3 应用层：RAGForge 后端单机 3 副本（不含 Nginx）
# 数据层在 Server 1（172.25.90.183），由 docker-compose-data.yml 管理
#
# 启动：docker compose -f docker-compose-backend.yml up -d
# 配置：/opt/shared/env/common.env + /opt/shared/env/ragforge.env
# 文件存储：宿主机 /data/files bind mount，3 副本共享
# SkyWalking：先启动共享 OAP/UI，确保外部网络 skywalking-net 已存在
services:
  backend-1:
    image: ragforge-backend:latest
    container_name: ragforge-backend-1
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - /opt/shared/env/common.env
      - /opt/shared/env/ragforge.env
    environment:
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/opt/skywalking-agent/skywalking-agent.jar
        -Dskywalking.agent.service_name=ragforge-backend
        -Dskywalking.collector.backend_service=skywalking-oap:11800
    volumes:
      - /data/files:/data/files
      - /opt/skywalking-agent:/opt/skywalking-agent:ro
    networks:
      - default
      - skywalking-net

  backend-2:
    image: ragforge-backend:latest
    container_name: ragforge-backend-2
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - /opt/shared/env/common.env
      - /opt/shared/env/ragforge.env
    environment:
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/opt/skywalking-agent/skywalking-agent.jar
        -Dskywalking.agent.service_name=ragforge-backend
        -Dskywalking.collector.backend_service=skywalking-oap:11800
    volumes:
      - /data/files:/data/files
      - /opt/skywalking-agent:/opt/skywalking-agent:ro
    networks:
      - default
      - skywalking-net

  backend-3:
    image: ragforge-backend:latest
    container_name: ragforge-backend-3
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - /opt/shared/env/common.env
      - /opt/shared/env/ragforge.env
    environment:
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/opt/skywalking-agent/skywalking-agent.jar
        -Dskywalking.agent.service_name=ragforge-backend
        -Dskywalking.collector.backend_service=skywalking-oap:11800
    volumes:
      - /data/files:/data/files
      - /opt/skywalking-agent:/opt/skywalking-agent:ro
    networks:
      - default
      - skywalking-net

networks:
  skywalking-net:
    external: true
    name: skywalking-net
