# Server 3 应用层：仅 RAGForge 后端（不含 Nginx）
# 数据层在 Server 1（172.25.90.183），由 docker-compose-data.yml 管理
#
# 启动：docker compose -f docker-compose-backend.yml up -d
services:
  backend:
    image: ragforge-backend:latest
    container_name: ragforge-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xms512m -Xmx2g"
    volumes:
      - files_data:/data/files

volumes:
  files_data:
