services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ragforge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ragforge
      POSTGRES_USER: ragforge
      POSTGRES_PASSWORD: ragforge
    mem_limit: 4g
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema 由 RAGForge backend 启动时 Flyway 执行（db/migration/V1–V5）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge -d ragforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ragforge-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    mem_limit: 5g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.0
    container_name: ragforge-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9876 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  rocketmq-broker:
    image: apache/rocketmq:5.1.0
    container_name: ragforge-rocketmq-broker
    restart: unless-stopped
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    mem_limit: 2g
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.1.0/conf/broker.conf:ro
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.1.0/conf/broker.conf

  redis:
    image: redis:7-alpine
    container_name: ragforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    mem_limit: 512m
    # 6379 端口对内网开放(安全组已挡公网),但内网里跑着多个服务,
    # 免密 Redis 等于任何一台机器都能读认证撤销名单 / 短信验证码 / 限流计数。
    # 口令从同目录 .env 取(REDIS_PASSWORD),不入 git;.env 缺失时 compose 会报错,
    # 这是故意的 —— 宁可起不来,也不要静默退回免密。
    command: redis-server --maxmemory 384mb --maxmemory-policy allkeys-lru --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ragforge-qdrant
    restart: unless-stopped
    ports:
      # 仅绑内网 IP，禁止公网暴露；叠加 API Key 兜底
      - "172.25.90.183:6333:6333"   # REST
      - "172.25.90.183:6334:6334"   # gRPC
    environment:
      # 密钥由 .env 注入，未设置则启动失败（禁止空鉴权）
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: "2"
    # 资源护栏：与 PG/ES/MQ 同机，限内存防 overcommit、限 CPU 防抢核
    mem_limit: 6g
    cpus: 2.0
    volumes:
      - /data/qdrant:/qdrant/storage   # 新挂 50G SSD

  reranker:
    build: ./reranker
    container_name: ragforge-reranker
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MODEL_NAME: BAAI/bge-reranker-v2-m3
      DEVICE: cpu
      HF_HUB_CACHE: /app/.cache/huggingface
    mem_limit: 3g
    volumes:
      - reranker_cache:/app/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  postgres_data:
  es_data:
  reranker_cache:

networks:
  default:
    ipam:
      config:
        - subnet: 10.255.10.0/24
