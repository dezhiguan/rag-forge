services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ragforge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ragforge
      POSTGRES_USER: ragforge
      POSTGRES_PASSWORD: ragforge
    mem_limit: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init/schema.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
      - ./backend/src/main/resources/db/migration/V1__init.sql:/docker-entrypoint-initdb.d/02-tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge -d ragforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ragforge-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1536m -Xmx1536m"
    mem_limit: 3g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.0
    container_name: ragforge-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9876 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  rocketmq-broker:
    image: apache/rocketmq:5.1.0
    container_name: ragforge-rocketmq-broker
    restart: unless-stopped
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    mem_limit: 512m
    command: sh mqbroker -n rocketmq-namesrv:9876 autoCreateTopicEnable=true

  redis:
    image: redis:7-alpine
    container_name: ragforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    mem_limit: 256m
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  reranker:
    build: ./reranker
    container_name: ragforge-reranker
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MODEL_NAME: BAAI/bge-reranker-v2-m3
      DEVICE: cpu
      HF_HUB_CACHE: /app/.cache/huggingface
    mem_limit: 3g
    volumes:
      - reranker_cache:/app/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  postgres_data:
  es_data:
  reranker_cache:

