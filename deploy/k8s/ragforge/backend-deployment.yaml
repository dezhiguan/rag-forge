apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragforge-backend
  namespace: ragforge
  labels:
    app: ragforge-backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ragforge-backend
  template:
    metadata:
      labels:
        app: ragforge-backend
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: docker.io/ragforge/backend:0.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: ragforge-backend-env
          env:
            - name: SPRING_PROFILES_ACTIVE
              # [SkyWalking-OFF 2026-06-19] 原值: prod,skywalking-log
              value: prod
            - name: JAVA_OPTS
              value: -Xms512m -Xmx1g
            - name: RAGFORGE_UPLOAD_PATH
              value: /data/files/
            - name: JAVA_TOOL_OPTIONS
              # [SkyWalking-OFF 2026-06-19] 已剥离 -javaagent 参数。
              # 恢复时使用下方注释的完整值：
              # value: >-
              #   -Xms512m -Xmx1g
              #   -javaagent:/opt/skywalking-agent/skywalking-agent.jar
              #   -Dskywalking.agent.service_name=ragforge-backend
              #   -Dskywalking.collector.backend_service=172.25.90.184:11800
              value: "-Xms512m -Xmx1g"
            # [SkyWalking-OFF 2026-06-19] 临时停用，恢复时取消下方注释
            # - name: SW_LOGGING_OUTPUT
            #   value: CONSOLE
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: ragforge-files
              mountPath: /data/files
            # [SkyWalking-OFF 2026-06-19] 临时停用，恢复时取消下方注释
            # - name: skywalking-agent
            #   mountPath: /opt/skywalking-agent
            #   readOnly: true
      volumes:
        - name: ragforge-files
          # nosemgrep: yaml.kubernetes.security.hostpath-mount.hostpath-mount
          # Temporary local file storage until RAGForge supports OSS.
          hostPath:
            path: /data/files
            type: DirectoryOrCreate
        # [SkyWalking-OFF 2026-06-19] 临时停用，恢复时取消下方注释
        # - name: skywalking-agent
        #   hostPath:
        #     path: /opt/skywalking-agent
        #     type: Directory
