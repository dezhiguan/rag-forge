apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragforge-api
  namespace: ragforge
  labels:
    app: ragforge-api
    role: api
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ragforge-api
  template:
    metadata:
      labels:
        app: ragforge-api
        role: api
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: docker.io/ragforge/backend:0.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ragforge-backend-config
            - secretRef:
                name: ragforge-backend-env
            # 接收网关 webhook 的 HMAC 验签密钥（RAGFORGE_AUTH_EVENT_HMAC_SECRET）。
            # 仅 api 需要（worker/judge 不收 webhook）。secret 值不入 git：见 deploy 文档。
            - secretRef:
                name: ragforge-event-hmac
          env:
            - name: RAGFORGE_ROLE
              value: api
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: servlet
            - name: METRICS_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ragforge-backend-env
                  key: METRICS_READER_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx1g"
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: ragforge-files
              mountPath: /data/files
      volumes:
        - name: ragforge-files
          hostPath:
            path: /data/files
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragforge-worker
  namespace: ragforge
  labels:
    app: ragforge-worker
    role: worker
spec:
  strategy:
    type: Recreate
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ragforge-worker
  template:
    metadata:
      labels:
        app: ragforge-worker
        role: worker
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: docker.io/ragforge/backend:0.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: ragforge-backend-config
            - secretRef:
                name: ragforge-backend-env
          env:
            - name: RAGFORGE_ROLE
              value: worker
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx1g -Dorg.apache.poi.openxml4j.opc.OPCPackage.useTempFile=true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: ragforge-files
              mountPath: /data/files
      volumes:
        - name: ragforge-files
          hostPath:
            path: /data/files
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragforge-judge
  namespace: ragforge
  labels:
    app: ragforge-judge
    role: judge
spec:
  strategy:
    type: Recreate
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ragforge-judge
  template:
    metadata:
      labels:
        app: ragforge-judge
        role: judge
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: docker.io/ragforge/backend:0.0.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef: { name: ragforge-backend-config }
            - secretRef: { name: ragforge-backend-env }
          env:
            - name: RAGFORGE_ROLE
              value: judge
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m"  # judge worker 内存可以小
          volumeMounts:
            - name: ragforge-files
              mountPath: /data/files
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 768Mi }
      volumes:
        - name: ragforge-files
          hostPath:
            path: /data/files
            type: DirectoryOrCreate
