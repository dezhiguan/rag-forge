apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragforge-api
  namespace: ragforge
  labels:
    app: ragforge-api
    role: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ragforge-api
  template:
    metadata:
      labels:
        app: ragforge-api
        role: api
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: docker.io/ragforge/backend:0.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ragforge-backend-config
            - secretRef:
                name: ragforge-backend-env
          env:
            - name: RAGFORGE_ROLE
              value: api
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: servlet
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx1g"
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: ragforge-files
              mountPath: /data/files
      volumes:
        - name: ragforge-files
          hostPath:
            path: /data/files
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragforge-worker
  namespace: ragforge
  labels:
    app: ragforge-worker
    role: worker
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ragforge-worker
  template:
    metadata:
      labels:
        app: ragforge-worker
        role: worker
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: docker.io/ragforge/backend:0.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: ragforge-backend-config
            - secretRef:
                name: ragforge-backend-env
          env:
            - name: RAGFORGE_ROLE
              value: worker
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx1g"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: ragforge-files
              mountPath: /data/files
      volumes:
        - name: ragforge-files
          hostPath:
            path: /data/files
            type: DirectoryOrCreate
