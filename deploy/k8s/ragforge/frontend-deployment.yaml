apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragforge-frontend
  namespace: ragforge
  labels:
    app: ragforge-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ragforge-frontend
  template:
    metadata:
      labels:
        app: ragforge-frontend
    spec:
      containers:
        - name: frontend
          image: ragforge/frontend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
