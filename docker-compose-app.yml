# LEGACY：单机应用层模式（Nginx + 后端同机部署，Server 2 旧方案）
# 新架构请使用：
#   - docker-compose-ingress.yml  → Server 2 入口层
#   - docker-compose-backend.yml  → Server 3 应用层
# 详见 docs/deployment-three-tier.md
services:
  backend:
    image: ragforge-backend:latest
    container_name: ragforge-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/opt/skywalking-agent/skywalking-agent.jar
        -Dskywalking.agent.service_name=ragforge-backend
        -Dskywalking.collector.backend_service=skywalking-oap:11800
    volumes:
      - files_data:/data/files
      - /opt/skywalking-agent:/opt/skywalking-agent:ro
    networks:
      - default
      - skywalking-net

  nginx:
    image: nginx:alpine
    container_name: ragforge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  files_data:

networks:
  skywalking-net:
    external: true
    name: skywalking-net
