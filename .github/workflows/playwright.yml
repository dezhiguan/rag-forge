name: Playwright Tests (manual)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  cloud-smoke:
    name: cloud-smoke-manual
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run cloud smoke
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ vars.RAGFORGE_BASE_URL || 'http://ragforge.net' }}
          PLAYWRIGHT_API_BASE_URL: ${{ vars.RAGFORGE_API_BASE_URL || 'http://ragforge.net/api/v1' }}
        run: npm run test:e2e:cloud

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ragforge-playwright-manual-report
          path: frontend/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ragforge-playwright-manual-results
          path: frontend/test-results/
          retention-days: 30
          if-no-files-found: ignore
