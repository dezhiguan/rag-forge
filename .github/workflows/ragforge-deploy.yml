name: RAGForge Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ragforge-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Resolve backend JAR
        id: jar
        run: |
          JAR_FILE="$(find backend/target -maxdepth 1 -name 'rag-forge-*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR found under backend/target"
            exit 1
          fi
          echo "path=${JAR_FILE}" >> "${GITHUB_OUTPUT}"
          echo "Using JAR: ${JAR_FILE}"

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-backend-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy-app:
    name: deploy-app-server3
    runs-on: ubuntu-latest
    needs:
      - backend-build
    steps:
      - name: Checkout deploy assets
        uses: actions/checkout@v4

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ragforge-backend-jar

      - name: Configure SSH (Server 3 via Server 2 jump)
        env:
          SSH_KEY: ${{ secrets.RAGFORGE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.RAGFORGE_APP_HOST }}
          DEPLOY_USER: ${{ secrets.RAGFORGE_APP_USER }}
          DEPLOY_PORT: ${{ secrets.RAGFORGE_APP_PORT }}
          JUMP_HOST: ${{ secrets.RAGFORGE_INGRESS_HOST }}
          JUMP_USER: ${{ secrets.RAGFORGE_INGRESS_USER }}
          JUMP_PORT: ${{ secrets.RAGFORGE_INGRESS_PORT }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "RAGFORGE_APP_SSH_KEY must be set"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          DEPLOY_HOST="${DEPLOY_HOST:-8.138.191.228}"
          DEPLOY_USER="${DEPLOY_USER:-root}"
          PORT="${DEPLOY_PORT:-22}"
          JUMP_HOST="${JUMP_HOST:-8.163.63.222}"
          JUMP_USER="${JUMP_USER:-root}"
          JUMP_PORT="${JUMP_PORT:-22}"
          ssh-keyscan -p "${JUMP_PORT}" "${JUMP_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            printf '%s\n' 'Host ragforge-jump'
            printf '%s\n' "  HostName ${JUMP_HOST}"
            printf '%s\n' "  User ${JUMP_USER}"
            printf '%s\n' "  Port ${JUMP_PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' ''
            printf '%s\n' 'Host ragforge-app'
            printf '%s\n' "  HostName ${DEPLOY_HOST}"
            printf '%s\n' "  User ${DEPLOY_USER}"
            printf '%s\n' "  Port ${PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  ProxyJump ragforge-jump'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload backend to Server 3
        env:
          APP_DIR: ${{ secrets.RAGFORGE_APP_DIR }}
        run: |
          APP_DIR="${APP_DIR:-/opt/rag-forge}"
          JAR_FILE="$(find . -maxdepth 1 -name 'rag-forge-*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR found in workspace"
            exit 1
          fi

          ssh ragforge-app "mkdir -p '${APP_DIR}/backend/target'"

          scp "${JAR_FILE}" "ragforge-app:${APP_DIR}/backend/target/"
          scp backend/Dockerfile "ragforge-app:${APP_DIR}/backend/Dockerfile"
          scp docker-compose-backend.yml "ragforge-app:${APP_DIR}/docker-compose-backend.yml"

      - name: Build image and restart backend on Server 3
        env:
          APP_DIR: ${{ secrets.RAGFORGE_APP_DIR }}
        run: |
          APP_DIR="${APP_DIR:-/opt/rag-forge}"
          ssh ragforge-app bash -s <<EOF
          set -euo pipefail
          cd "${APP_DIR}/backend"
          docker build -t ragforge-backend:latest .
          cd "${APP_DIR}"
          COMPOSE_FILES=(-f docker-compose-backend.yml)
          if [[ -f docker-compose.override.yml ]]; then
            COMPOSE_FILES+=(-f docker-compose.override.yml)
            echo "Using local override: docker-compose.override.yml"
          fi
          docker compose "\${COMPOSE_FILES[@]}" up -d --force-recreate
          docker compose "\${COMPOSE_FILES[@]}" ps
          EOF

      - name: Verify backend health on Server 3
        run: |
          ssh ragforge-app bash -s <<'EOF'
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null; then
              echo "Server 3 backend health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Server 3 backend health check failed" >&2
          exit 1
          EOF

  deploy-ingress:
    name: deploy-ingress-server2
    runs-on: ubuntu-latest
    needs:
      - frontend-build
    steps:
      - name: Checkout deploy assets
        uses: actions/checkout@v4

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ragforge-frontend-dist
          path: frontend-dist

      - name: Configure SSH (Server 2)
        env:
          SSH_KEY: ${{ secrets.RAGFORGE_INGRESS_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.RAGFORGE_INGRESS_HOST }}
          DEPLOY_USER: ${{ secrets.RAGFORGE_INGRESS_USER }}
          DEPLOY_PORT: ${{ secrets.RAGFORGE_INGRESS_PORT }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "RAGFORGE_INGRESS_SSH_KEY must be set"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          DEPLOY_HOST="${DEPLOY_HOST:-8.163.63.222}"
          DEPLOY_USER="${DEPLOY_USER:-root}"
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "${PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            printf '%s\n' 'Host ragforge-ingress'
            printf '%s\n' "  HostName ${DEPLOY_HOST}"
            printf '%s\n' "  User ${DEPLOY_USER}"
            printf '%s\n' "  Port ${PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload frontend and config to Server 2
        env:
          INGRESS_DIR: ${{ secrets.RAGFORGE_INGRESS_DIR }}
        run: |
          INGRESS_DIR="${INGRESS_DIR:-/opt/rag-forge}"
          RSYNC_SSH="ssh -F ${HOME}/.ssh/config"

          ssh ragforge-ingress "mkdir -p '${INGRESS_DIR}/frontend/dist'"

          # Preserve the CareerMate frontend subdir, which is synced by CareerMate CI.
          rsync -avz --delete --exclude 'careermate/' -e "${RSYNC_SSH}" \
            frontend-dist/ \
            "ragforge-ingress:${INGRESS_DIR}/frontend/dist/"

          scp nginx.conf "ragforge-ingress:${INGRESS_DIR}/nginx.conf"
          scp docker-compose-ingress.yml "ragforge-ingress:${INGRESS_DIR}/docker-compose-ingress.yml"

      - name: Restart Nginx on Server 2
        env:
          INGRESS_DIR: ${{ secrets.RAGFORGE_INGRESS_DIR }}
        run: |
          INGRESS_DIR="${INGRESS_DIR:-/opt/rag-forge}"
          ssh ragforge-ingress bash -s <<EOF
          set -euo pipefail
          cd "${INGRESS_DIR}"
          docker compose -f docker-compose-ingress.yml up -d --force-recreate
          docker compose -f docker-compose-ingress.yml ps
          EOF

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    needs:
      - deploy-app
      - deploy-ingress
    steps:
      - name: API health check
        run: curl -fsS "${{ vars.RAGFORGE_API_BASE_URL || 'http://8.163.63.222/api/v1' }}/health"

      - name: Frontend entry check
        run: curl -fsS "${{ vars.RAGFORGE_BASE_URL || 'http://8.163.63.222' }}/" | grep -qi 'rag'

  postdeploy-playwright:
    name: postdeploy-playwright
    runs-on: ubuntu-latest
    needs: smoke-test
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run post-deploy cloud smoke
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ vars.RAGFORGE_BASE_URL || 'http://8.163.63.222' }}
          PLAYWRIGHT_API_BASE_URL: ${{ vars.RAGFORGE_API_BASE_URL || 'http://8.163.63.222/api/v1' }}
        run: npm run test:e2e:cloud

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ragforge-playwright-postdeploy-report
          path: frontend/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ragforge-playwright-postdeploy-results
          path: frontend/test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Post-deploy Playwright cloud smoke passed." >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "Deployment completed, but post-deploy Playwright cloud smoke failed."
              echo "Check **ragforge-playwright-postdeploy-report** artifact."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
