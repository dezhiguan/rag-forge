name: RAGForge CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ragforge-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-smoke-test:
    name: backend-smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run stable backend smoke tests
        working-directory: backend
        run: >
          mvn -B test
          -Dtest=ApiKeyServiceImplTest,SearchControllerTest,GlobalExceptionHandlerTest,ApiKeyInterceptorTest,ApiKeyInterceptorRateLimitTest,RerankerClientTest,QueryRewriterTest,HybridSearchServiceTest,RetrievalServiceTest

  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-smoke-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Resolve backend JAR
        id: jar
        run: |
          JAR_FILE="$(find backend/target -maxdepth 1 -name 'rag-forge-*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR found under backend/target"
            exit 1
          fi
          echo "path=${JAR_FILE}" >> "${GITHUB_OUTPUT}"
          echo "Using JAR: ${JAR_FILE}"

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-backend-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy-app:
    name: deploy-app-nodes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - backend-build
    steps:
      - name: Checkout deploy assets
        uses: actions/checkout@v4

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ragforge-backend-jar

      - name: Configure SSH (App nodes via Server 2 jump)
        env:
          SSH_KEY: ${{ secrets.RAGFORGE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.RAGFORGE_APP_HOST }}
          DEPLOY_HOSTS: ${{ secrets.RAGFORGE_APP_HOSTS }}
          DEPLOY_USER: ${{ secrets.RAGFORGE_APP_USER }}
          DEPLOY_PORT: ${{ secrets.RAGFORGE_APP_PORT }}
          JUMP_HOST: ${{ secrets.RAGFORGE_INGRESS_HOST }}
          JUMP_USER: ${{ secrets.RAGFORGE_INGRESS_USER }}
          JUMP_PORT: ${{ secrets.RAGFORGE_INGRESS_PORT }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "RAGFORGE_APP_SSH_KEY must be set"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          APP_HOSTS="${DEPLOY_HOSTS:-${DEPLOY_HOST:-8.138.191.228}}"
          DEPLOY_USER="${DEPLOY_USER:-root}"
          PORT="${DEPLOY_PORT:-22}"
          JUMP_HOST="${JUMP_HOST:-8.163.63.222}"
          JUMP_USER="${JUMP_USER:-root}"
          JUMP_PORT="${JUMP_PORT:-22}"

          timeout 30s ssh-keyscan -p "${JUMP_PORT}" "${JUMP_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            printf '%s\n' 'Host ragforge-jump'
            printf '%s\n' "  HostName ${JUMP_HOST}"
            printf '%s\n' "  User ${JUMP_USER}"
            printf '%s\n' "  Port ${JUMP_PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ConnectTimeout 15'
            printf '%s\n' '  ServerAliveInterval 15'
            printf '%s\n' '  ServerAliveCountMax 3'
          } > ~/.ssh/config

          : > /tmp/ragforge_app_aliases
          index=0
          while IFS= read -r raw_host; do
            host_entry="$(printf '%s' "${raw_host}" | xargs)"
            [[ -z "${host_entry}" ]] && continue
            index=$((index + 1))

            app_user="${DEPLOY_USER}"
            app_host_port="${host_entry}"
            if [[ "${host_entry}" == *@* ]]; then
              app_user="${host_entry%@*}"
              app_host_port="${host_entry#*@}"
            fi

            app_host="${app_host_port}"
            app_port="${PORT}"
            if [[ "${app_host_port}" =~ ^[0-9.]+:[0-9]+$ || "${app_host_port}" =~ ^[^:]+:[0-9]+$ ]]; then
              app_host="${app_host_port%:*}"
              app_port="${app_host_port##*:}"
            fi

            alias="ragforge-app-${index}"
            printf '%s\n' "${alias}" >> /tmp/ragforge_app_aliases
            {
              printf '%s\n' ''
              printf '%s\n' "Host ${alias}"
              printf '%s\n' "  HostName ${app_host}"
              printf '%s\n' "  User ${app_user}"
              printf '%s\n' "  Port ${app_port}"
              printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
              printf '%s\n' '  IdentitiesOnly yes'
              printf '%s\n' '  StrictHostKeyChecking accept-new'
              printf '%s\n' '  BatchMode yes'
              printf '%s\n' '  ConnectTimeout 15'
              printf '%s\n' '  ServerAliveInterval 15'
              printf '%s\n' '  ServerAliveCountMax 3'
              printf '%s\n' '  ProxyJump ragforge-jump'
            } >> ~/.ssh/config
          done < <(printf '%s\n' "${APP_HOSTS}" | tr ',;' '\n')

          if [[ ! -s /tmp/ragforge_app_aliases ]]; then
            echo "No app nodes configured. Set RAGFORGE_APP_HOST or RAGFORGE_APP_HOSTS."
            exit 1
          fi

          echo "Configured app nodes:"
          cat /tmp/ragforge_app_aliases
          chmod 600 ~/.ssh/config

      - name: Upload backend to app nodes
        env:
          APP_DIR: ${{ secrets.RAGFORGE_APP_DIR }}
        run: |
          APP_DIR="${APP_DIR:-/opt/rag-forge}"
          JAR_FILE="$(find . -maxdepth 1 -name 'rag-forge-*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR found in workspace"
            exit 1
          fi

          SSH_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          SCP_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)

          while IFS= read -r alias; do
            echo "Uploading backend to ${alias}"
            timeout 2m ssh -T "${SSH_OPTS[@]}" "${alias}" "mkdir -p '${APP_DIR}/backend/target'"
            timeout 5m scp "${SCP_OPTS[@]}" "${JAR_FILE}" "${alias}:${APP_DIR}/backend/target/"
            timeout 2m scp "${SCP_OPTS[@]}" backend/Dockerfile "${alias}:${APP_DIR}/backend/Dockerfile"
            timeout 2m scp "${SCP_OPTS[@]}" docker-compose-backend.yml "${alias}:${APP_DIR}/docker-compose-backend.yml"
          done < /tmp/ragforge_app_aliases

      - name: Build image and restart backend on app nodes
        env:
          APP_DIR: ${{ secrets.RAGFORGE_APP_DIR }}
        run: |
          APP_DIR="${APP_DIR:-/opt/rag-forge}"
          SSH_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)

          while IFS= read -r alias; do
            echo "Deploying backend on ${alias}"
            timeout 25m ssh -T "${SSH_OPTS[@]}" "${alias}" "APP_DIR='${APP_DIR}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${APP_DIR}/backend"
          docker build -t ragforge-backend:latest .
          cd "${APP_DIR}"
          docker rm -f ragforge-backend 2>/dev/null || true
          if [[ ! -f /opt/shared/env/common.env || ! -f /opt/shared/env/ragforge.env ]]; then
            echo "Missing shared env files: /opt/shared/env/common.env and /opt/shared/env/ragforge.env" >&2
            exit 1
          fi
          docker compose -f docker-compose-backend.yml up -d --force-recreate
          docker compose -f docker-compose-backend.yml ps
          EOF
          done < /tmp/ragforge_app_aliases

      - name: Verify backend health on app nodes
        env:
          APP_HEALTH_PORTS: ${{ secrets.RAGFORGE_APP_HEALTH_PORTS }}
        run: |
          APP_HEALTH_PORTS="${APP_HEALTH_PORTS:-8080 8081 8082}"
          SSH_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)

          while IFS= read -r alias; do
            echo "Checking backend health on ${alias}"
            timeout 20m ssh -T "${SSH_OPTS[@]}" "${alias}" "APP_HEALTH_PORTS='${APP_HEALTH_PORTS}' bash -s" <<'EOF'
          set -euo pipefail
          for port in ${APP_HEALTH_PORTS}; do
            echo "Checking backend port ${port}"
            healthy=0
            for i in $(seq 1 60); do
              if curl -sf "http://127.0.0.1:${port}/api/v1/health" >/dev/null; then
                echo "Backend port ${port} health check passed (attempt ${i})"
                healthy=1
                break
              fi
              echo "Waiting for backend port ${port}... attempt ${i}/60"
              sleep 5
            done

            if [[ "${healthy}" != "1" ]]; then
              echo "Backend port ${port} health check failed after 5 minutes" >&2
              echo "=== docker ps ===" >&2
              docker ps -a --filter name=ragforge-backend >&2 || true
              echo "=== container logs (last 300 lines) ===" >&2
              for name in ragforge-backend-1 ragforge-backend-2 ragforge-backend-3 ragforge-backend; do
                docker logs "${name}" --tail 120 >&2 2>/dev/null || true
              done
              exit 1
            fi
          done
          EOF
          done < /tmp/ragforge_app_aliases

  deploy-ingress:
    name: deploy-ingress-server2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - frontend-build
      - deploy-app
    steps:
      - name: Checkout deploy assets
        uses: actions/checkout@v4

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ragforge-frontend-dist
          path: frontend-dist

      - name: Configure SSH (Server 2)
        env:
          SSH_KEY: ${{ secrets.RAGFORGE_INGRESS_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.RAGFORGE_INGRESS_HOST }}
          DEPLOY_USER: ${{ secrets.RAGFORGE_INGRESS_USER }}
          DEPLOY_PORT: ${{ secrets.RAGFORGE_INGRESS_PORT }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "RAGFORGE_INGRESS_SSH_KEY must be set"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          DEPLOY_HOST="${DEPLOY_HOST:-8.163.63.222}"
          DEPLOY_USER="${DEPLOY_USER:-root}"
          PORT="${DEPLOY_PORT:-22}"
          timeout 30s ssh-keyscan -p "${PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          {
            printf '%s\n' 'Host ragforge-ingress'
            printf '%s\n' "  HostName ${DEPLOY_HOST}"
            printf '%s\n' "  User ${DEPLOY_USER}"
            printf '%s\n' "  Port ${PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ConnectTimeout 15'
            printf '%s\n' '  ServerAliveInterval 15'
            printf '%s\n' '  ServerAliveCountMax 3'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload frontend and config to Server 2
        env:
          INGRESS_DIR: ${{ secrets.RAGFORGE_INGRESS_DIR }}
          BACKEND_UPSTREAMS: ${{ secrets.RAGFORGE_BACKEND_UPSTREAMS }}
        run: |
          INGRESS_DIR="${INGRESS_DIR:-/opt/rag-forge}"
          RSYNC_SSH="ssh -F ${HOME}/.ssh/config -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          SCP_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          SSH_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          NGINX_CONF="nginx.conf"

          if [[ -n "${BACKEND_UPSTREAMS}" ]]; then
            echo "Rendering RAGForge backend upstreams from RAGFORGE_BACKEND_UPSTREAMS"
            {
              printf '%s\n' '# BEGIN RAGFORGE_BACKEND_UPSTREAM'
              printf '%s\n' 'upstream ragforge_backend {'
              printf '%s\n' '    least_conn;'
              while IFS= read -r upstream; do
                upstream="$(printf '%s' "${upstream}" | xargs)"
                [[ -z "${upstream}" ]] && continue
                printf '    server %s;\n' "${upstream}"
              done < <(printf '%s\n' "${BACKEND_UPSTREAMS}" | tr ',;' '\n')
              printf '%s\n' '    keepalive 32;'
              printf '%s\n' '}'
              printf '%s\n' '# END RAGFORGE_BACKEND_UPSTREAM'
            } > /tmp/ragforge_backend_upstream.conf

            if ! grep -q '^    server ' /tmp/ragforge_backend_upstream.conf; then
              echo "RAGFORGE_BACKEND_UPSTREAMS is set but no valid upstream entries were found"
              exit 1
            fi

            awk '
              BEGIN {
                while ((getline line < "/tmp/ragforge_backend_upstream.conf") > 0) {
                  replacement = replacement line ORS
                }
              }
              /^# BEGIN RAGFORGE_BACKEND_UPSTREAM$/ {
                printf "%s", replacement
                skip = 1
                next
              }
              /^# END RAGFORGE_BACKEND_UPSTREAM$/ {
                skip = 0
                next
              }
              !skip { print }
            ' nginx.conf > nginx.rendered.conf
            NGINX_CONF="nginx.rendered.conf"
          fi

          timeout 2m ssh -T "${SSH_OPTS[@]}" ragforge-ingress "mkdir -p '${INGRESS_DIR}/frontend/dist'"

          # Preserve the CareerForge frontend subdir, which is synced by CareerMate CI.
          timeout 10m rsync -avz --delete --exclude 'careerforge/' -e "${RSYNC_SSH}" \
            frontend-dist/ \
            "ragforge-ingress:${INGRESS_DIR}/frontend/dist/"

          timeout 3m scp "${SCP_OPTS[@]}" "${NGINX_CONF}" "ragforge-ingress:${INGRESS_DIR}/nginx.conf"
          timeout 3m scp "${SCP_OPTS[@]}" docker-compose-ingress.yml "ragforge-ingress:${INGRESS_DIR}/docker-compose-ingress.yml"

      - name: Restart Nginx on Server 2
        env:
          INGRESS_DIR: ${{ secrets.RAGFORGE_INGRESS_DIR }}
        run: |
          INGRESS_DIR="${INGRESS_DIR:-/opt/rag-forge}"
          SSH_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)

          timeout 5m ssh -T "${SSH_OPTS[@]}" ragforge-ingress "INGRESS_DIR='${INGRESS_DIR}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${INGRESS_DIR}"
          docker compose -f docker-compose-ingress.yml up -d --force-recreate
          docker compose -f docker-compose-ingress.yml ps
          EOF

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - deploy-app
      - deploy-ingress
    steps:
      - name: API health check
        run: curl -fsS --max-time 20 "${{ vars.RAGFORGE_API_BASE_URL || 'https://ragforge.net/api/v1' }}/health"

      - name: Frontend entry check
        run: curl -fsS --max-time 20 "${{ vars.RAGFORGE_BASE_URL || 'https://ragforge.net' }}/" | grep -qi 'rag'
