name: RAGForge CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ragforge-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run static security scan
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --error \
            --metrics=off \
            --exclude '**/target' \
            --exclude '**/node_modules' \
            --exclude '**/dist' \
            --exclude '**/build' \
            .

  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Resolve backend JAR
        id: jar
        run: |
          JAR_FILE="$(find backend/target -maxdepth 1 -name 'rag-forge-*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR found under backend/target"
            exit 1
          fi
          echo "path=${JAR_FILE}" >> "${GITHUB_OUTPUT}"
          echo "Using JAR: ${JAR_FILE}"

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-backend-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  backend-unit-test:
    name: backend-unit-test
    # [BackendUnitTest-OFF 2026-06-19] 临时置灰，CI 上会显示为 skipped。
    # 恢复方法：删除下方 `if: false` 这一行即可。
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-scan
    steps:
      # [BackendUnitTest-OFF 2026-06-19] 下方 steps 保留，if:false 期间不会执行。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check backend unit test coverage
        working-directory: backend
        run: >
          mvn -B -T 1C verify
          -Dspring-boot.repackage.skip=true

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ragforge-backend-unit-test-coverage
          path: backend/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ragforge-backend-unit-test-reports
          path: backend/target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy-k3s:
    name: deploy-k3s-server3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - backend-build
      - frontend-build
      # [BackendUnitTest-OFF 2026-06-19] 临时置灰 backend-unit-test，恢复时取消下一行注释
      # - backend-unit-test
    steps:
      - name: Checkout deploy assets
        uses: actions/checkout@v4

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ragforge-backend-jar
          path: backend/target

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ragforge-frontend-dist
          path: frontend/dist

      - name: Configure SSH (Server 3 via Server 2 jump)
        env:
          SSH_KEY: ${{ secrets.RAGFORGE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.RAGFORGE_APP_HOST }}
          DEPLOY_USER: ${{ secrets.RAGFORGE_APP_USER }}
          DEPLOY_PORT: ${{ secrets.RAGFORGE_APP_PORT }}
          JUMP_HOST: ${{ secrets.RAGFORGE_INGRESS_HOST }}
          JUMP_USER: ${{ secrets.RAGFORGE_INGRESS_USER }}
          JUMP_PORT: ${{ secrets.RAGFORGE_INGRESS_PORT }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "RAGFORGE_APP_SSH_KEY must be set"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          DEPLOY_HOST="${DEPLOY_HOST:-8.138.191.228}"
          DEPLOY_USER="${DEPLOY_USER:-root}"
          PORT="${DEPLOY_PORT:-22}"
          JUMP_HOST="${JUMP_HOST:-8.163.63.222}"
          JUMP_USER="${JUMP_USER:-root}"
          JUMP_PORT="${JUMP_PORT:-22}"

          timeout 30s ssh-keyscan -p "${JUMP_PORT}" "${JUMP_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            printf '%s\n' 'Host ragforge-jump'
            printf '%s\n' "  HostName ${JUMP_HOST}"
            printf '%s\n' "  User ${JUMP_USER}"
            printf '%s\n' "  Port ${JUMP_PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ConnectTimeout 15'
            printf '%s\n' '  ServerAliveInterval 15'
            printf '%s\n' '  ServerAliveCountMax 3'
            printf '%s\n' ''
            printf '%s\n' 'Host ragforge-k3s'
            printf '%s\n' "  HostName ${DEPLOY_HOST}"
            printf '%s\n' "  User ${DEPLOY_USER}"
            printf '%s\n' "  Port ${PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ConnectTimeout 15'
            printf '%s\n' '  ServerAliveInterval 15'
            printf '%s\n' '  ServerAliveCountMax 3'
            printf '%s\n' '  ProxyJump ragforge-jump'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync repo to Server 3
        env:
          APP_DIR: ${{ secrets.RAGFORGE_K8S_SRC_DIR }}
        run: |
          APP_DIR="${APP_DIR:-/opt/rag-forge/k8s-src}"
          JAR_FILE="$(find backend/target -maxdepth 1 -name 'rag-forge-*.jar' ! -name '*.original' | head -n 1)"
          if [[ -z "${JAR_FILE}" ]]; then
            echo "No backend JAR found under backend/target"
            exit 1
          fi

          SSH_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          RSYNC_SSH="ssh -F ${HOME}/.ssh/config -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"

          timeout 2m ssh -T "${SSH_OPTS[@]}" ragforge-k3s "mkdir -p '${APP_DIR}'"
          timeout 12m rsync -az --delete \
            --exclude '.git' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude 'backend/src/test/' \
            --exclude 'backend/target/surefire-reports/' \
            --exclude 'backend/target/site/' \
            --exclude 'frontend/node_modules' \
            --exclude 'playwright-report/' \
            --exclude 'test-results/' \
            --exclude 'reranker/__pycache__' \
            -e "${RSYNC_SSH}" \
            ./ "ragforge-k3s:${APP_DIR}/"

      - name: Build and import ragforge-frontend image on Server 3
        env:
          APP_DIR: ${{ secrets.RAGFORGE_K8S_SRC_DIR }}
        run: |
          APP_DIR="${APP_DIR:-/opt/rag-forge/k8s-src}"
          SSH_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)

          timeout 10m ssh -T "${SSH_OPTS[@]}" ragforge-k3s "APP_DIR='${APP_DIR}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${APP_DIR}"
          if [[ ! -d frontend/dist ]]; then
            echo "Missing frontend/dist for runtime-prebuilt image" >&2
            exit 1
          fi
          docker build -f frontend/Dockerfile --target runtime-prebuilt -t ragforge/frontend:latest .
          docker save ragforge/frontend:latest | sudo k3s ctr -n k8s.io images import -
          EOF

      - name: Deploy backend to k3s on Server 3
        env:
          APP_DIR: ${{ secrets.RAGFORGE_K8S_SRC_DIR }}
        run: |
          APP_DIR="${APP_DIR:-/opt/rag-forge/k8s-src}"
          SSH_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)

          timeout 25m ssh -T "${SSH_OPTS[@]}" ragforge-k3s "APP_DIR='${APP_DIR}' RAGFORGE_BACKEND_IMAGE_TAG='${GITHUB_SHA::12}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${APP_DIR}"
          if [[ ! -f /opt/shared/env/common.env || ! -f /opt/shared/env/ragforge.env ]]; then
            echo "Missing shared env files: /opt/shared/env/common.env and /opt/shared/env/ragforge.env" >&2
            exit 1
          fi
          sudo -n env SKIP_BACKEND_BUILD=1 bash deploy/scripts/deploy-ragforge-k8s.sh
          EOF

      - name: Verify k3s backend health
        run: |
          SSH_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          timeout 10m ssh -T "${SSH_OPTS[@]}" ragforge-k3s "bash -s" <<'EOF'
          set -euo pipefail
          sudo k3s kubectl -n ragforge rollout status deployment/ragforge-backend --timeout=300s
          sudo k3s kubectl -n ragforge get pods -o wide
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:31090/api/v1/health" >/dev/null; then
              echo "RAGForge k3s backend health check passed (attempt ${i})"
              exit 0
            fi
            echo "Waiting for RAGForge k3s backend... attempt ${i}/60"
            sleep 5
          done
          echo "RAGForge k3s backend health check failed" >&2
          sudo k3s kubectl -n ragforge get pods -o wide >&2 || true
          sudo k3s kubectl -n ragforge logs deployment/ragforge-backend --tail=200 >&2 || true
          exit 1
          EOF

  deploy-ingress:
    name: deploy-ingress-server2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 条件触发：只在 Server 2 nginx 相关配置变化时跑（避免每次 PR 都跑 30s 的 ingress 推送）。
    # 触发文件：nginx.conf / docker-compose-ingress.yml / patch-skywalking-ui-router-base.sh
    # 紧急强制触发：commit message 中包含 [force-deploy-ingress]
    if: |
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (
        contains(toJSON(github.event.commits.*.modified), 'nginx.conf') ||
        contains(toJSON(github.event.commits.*.added), 'nginx.conf') ||
        contains(toJSON(github.event.commits.*.modified), 'docker-compose-ingress.yml') ||
        contains(toJSON(github.event.commits.*.added), 'docker-compose-ingress.yml') ||
        contains(toJSON(github.event.commits.*.modified), 'deploy/scripts/patch-skywalking-ui-router-base.sh') ||
        contains(github.event.head_commit.message, '[force-deploy-ingress]')
      )
    needs:
      - frontend-build
      - deploy-k3s
    steps:
      - name: Checkout deploy assets
        uses: actions/checkout@v4

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ragforge-frontend-dist
          path: frontend-dist

      - name: Configure SSH (Server 2)
        env:
          SSH_KEY: ${{ secrets.RAGFORGE_INGRESS_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.RAGFORGE_INGRESS_HOST }}
          DEPLOY_USER: ${{ secrets.RAGFORGE_INGRESS_USER }}
          DEPLOY_PORT: ${{ secrets.RAGFORGE_INGRESS_PORT }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "RAGFORGE_INGRESS_SSH_KEY must be set"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          DEPLOY_HOST="${DEPLOY_HOST:-8.163.63.222}"
          DEPLOY_USER="${DEPLOY_USER:-root}"
          PORT="${DEPLOY_PORT:-22}"
          timeout 30s ssh-keyscan -p "${PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          {
            printf '%s\n' 'Host ragforge-ingress'
            printf '%s\n' "  HostName ${DEPLOY_HOST}"
            printf '%s\n' "  User ${DEPLOY_USER}"
            printf '%s\n' "  Port ${PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ConnectTimeout 15'
            printf '%s\n' '  ServerAliveInterval 15'
            printf '%s\n' '  ServerAliveCountMax 3'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload frontend and config to Server 2
        env:
          INGRESS_DIR: ${{ secrets.RAGFORGE_INGRESS_DIR }}
        run: |
          INGRESS_DIR="${INGRESS_DIR:-/opt/rag-forge}"
          RSYNC_SSH="ssh -F ${HOME}/.ssh/config -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          SCP_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          SSH_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          NGINX_CONF="nginx.conf"
          BACKEND_UPSTREAMS="172.25.90.184:31090"

          if true; then
            echo "Rendering RAGForge backend upstreams for k3s"
            {
              printf '%s\n' '# BEGIN RAGFORGE_BACKEND_UPSTREAM'
              printf '%s\n' 'upstream ragforge_backend {'
              printf '%s\n' '    least_conn;'
              while IFS= read -r upstream; do
                upstream="$(printf '%s' "${upstream}" | xargs)"
                [[ -z "${upstream}" ]] && continue
                printf '    server %s;\n' "${upstream}"
              done < <(printf '%s\n' "${BACKEND_UPSTREAMS}" | tr ',;' '\n')
              printf '%s\n' '    keepalive 32;'
              printf '%s\n' '}'
              printf '%s\n' '# END RAGFORGE_BACKEND_UPSTREAM'
            } > /tmp/ragforge_backend_upstream.conf

            if ! grep -q '^    server ' /tmp/ragforge_backend_upstream.conf; then
              echo "No valid RAGForge backend upstream entries were found"
              exit 1
            fi

            awk '
              BEGIN {
                while ((getline line < "/tmp/ragforge_backend_upstream.conf") > 0) {
                  replacement = replacement line ORS
                }
              }
              /^# BEGIN RAGFORGE_BACKEND_UPSTREAM$/ {
                printf "%s", replacement
                skip = 1
                next
              }
              /^# END RAGFORGE_BACKEND_UPSTREAM$/ {
                skip = 0
                next
              }
              !skip { print }
            ' nginx.conf > nginx.rendered.conf
            NGINX_CONF="nginx.rendered.conf"
          fi

          timeout 2m ssh -T "${SSH_OPTS[@]}" ragforge-ingress "mkdir -p '${INGRESS_DIR}/frontend/dist'"

          # [SkyWalking-OFF 2026-06-19] careerforge 残留目录已由架构师手动清理，不再需要 --exclude 保留。
          # 恢复方法：在 rsync 参数中重新加入 `--exclude 'careerforge/'`
          # [FrontendK8s-MIGRATED 2026-06-19] 前端已迁移到 K8s（NodePort 31002），无需再 rsync dist 到 Server 2。
          # 恢复方法：取消下方注释；同时把 nginx.conf 的 location / 改回 root /usr/share/nginx/html。
          # timeout 10m rsync -avz --delete -e "${RSYNC_SSH}" \
          #   frontend-dist/ \
          #   "ragforge-ingress:${INGRESS_DIR}/frontend/dist/"

          timeout 3m scp "${SCP_OPTS[@]}" "${NGINX_CONF}" "ragforge-ingress:${INGRESS_DIR}/nginx.conf"
          timeout 3m scp "${SCP_OPTS[@]}" docker-compose-ingress.yml "ragforge-ingress:${INGRESS_DIR}/docker-compose-ingress.yml"
          timeout 3m ssh -T "${SSH_OPTS[@]}" ragforge-ingress "mkdir -p '${INGRESS_DIR}/deploy/scripts'"
          # [SkyWalking-OFF 2026-06-19] 临时停用 SkyWalking，无需 patch UI router base
          # timeout 3m scp "${SCP_OPTS[@]}" deploy/scripts/patch-skywalking-ui-router-base.sh \
          #   "ragforge-ingress:${INGRESS_DIR}/deploy/scripts/patch-skywalking-ui-router-base.sh"

      - name: Restart Nginx on Server 2
        env:
          INGRESS_DIR: ${{ secrets.RAGFORGE_INGRESS_DIR }}
        run: |
          INGRESS_DIR="${INGRESS_DIR:-/opt/rag-forge}"
          SSH_OPTS=(-F "${HOME}/.ssh/config" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)

          timeout 5m ssh -T "${SSH_OPTS[@]}" ragforge-ingress "INGRESS_DIR='${INGRESS_DIR}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${INGRESS_DIR}"
          # [SkyWalking-OFF 2026-06-19] 临时停用 SkyWalking，无需执行 router base patch
          # bash deploy/scripts/patch-skywalking-ui-router-base.sh
          docker compose -f docker-compose-ingress.yml up -d --force-recreate
          docker compose -f docker-compose-ingress.yml ps
          EOF

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 允许 deploy-ingress 被条件触发 skip 时仍跑 smoke-test（生产 nginx 不变也要验证）。
    if: |
      !failure() && !cancelled() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy-k3s.result == 'success'
    needs:
      - deploy-k3s
      - deploy-ingress
    steps:
      - name: API health check
        run: curl -fsS --max-time 20 "${{ vars.RAGFORGE_API_BASE_URL || 'https://ragforge.net/api/v1' }}/health"

      - name: Frontend entry check
        run: curl -fsS --max-time 20 "${{ vars.RAGFORGE_BASE_URL || 'https://ragforge.net' }}/" | grep -qi 'rag'
