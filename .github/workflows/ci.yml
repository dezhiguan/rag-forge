name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Run unit tests
        working-directory: backend
        run: >
          mvn -B test
          -Dtest=TextChunkerTest,GlobalExceptionHandlerTest,DashScopeEmbeddingServiceTest,TikaDocumentParserTest

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
