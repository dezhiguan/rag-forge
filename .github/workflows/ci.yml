name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "nginx.conf"
      - "docker-compose-app.yml"
      - "deploy.sh"
      - ".github/workflows/ci.yml"

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Run unit tests
        working-directory: backend
        run: >
          mvn -B test
          -Dtest=TextChunkerTest,GlobalExceptionHandlerTest,DashScopeEmbeddingServiceTest,TikaDocumentParserTest

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          retention-days: 1
          path: |
            backend/target/rag-forge-*.jar
            frontend/dist

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to app server
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SKIP_BUILD: "1"
        run: ./deploy.sh

  postdeploy-playwright:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run post-deploy Playwright smoke test
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.RAGFORGE_BASE_URL || 'http://8.163.63.222' }}
          PLAYWRIGHT_API_BASE_URL: ${{ vars.RAGFORGE_API_BASE_URL || 'http://8.163.63.222/api/v1' }}
        run: npm run test:e2e:cloud

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-playwright-postdeploy-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-playwright-postdeploy-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
