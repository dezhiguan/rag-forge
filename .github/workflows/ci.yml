name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "nginx.conf"
      - "docker-compose-app.yml"
      - "docker-compose-backend.yml"
      - "docker-compose-ingress.yml"
      - "deploy.sh"
      - ".github/workflows/ci.yml"

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Run unit tests
        working-directory: backend
        run: >
          mvn -B test
          -Dtest=TextChunkerTest,GlobalExceptionHandlerTest,DashScopeEmbeddingServiceTest,TikaDocumentParserTest

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          retention-days: 1
          path: |
            backend/target/rag-forge-*.jar
            frontend/dist

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Setup SSH
        env:
          INGRESS_KEY: ${{ secrets.RAGFORGE_INGRESS_SSH_KEY }}
          APP_KEY: ${{ secrets.RAGFORGE_APP_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          INGRESS_HOST_VALUE: ${{ secrets.RAGFORGE_INGRESS_HOST }}
          APP_HOST_VALUE: ${{ secrets.RAGFORGE_APP_HOST }}
          INGRESS_PORT_VALUE: ${{ secrets.RAGFORGE_INGRESS_PORT }}
          APP_PORT_VALUE: ${{ secrets.RAGFORGE_APP_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          INGRESS_KEY="${INGRESS_KEY:-${LEGACY_KEY}}"
          APP_KEY="${APP_KEY:-${INGRESS_KEY}}"
          if [[ -z "${INGRESS_KEY}" ]]; then
            echo "RAGFORGE_INGRESS_SSH_KEY or SSH_PRIVATE_KEY must be set"
            exit 1
          fi
          if [[ -z "${APP_KEY}" ]]; then
            echo "RAGFORGE_APP_SSH_KEY or RAGFORGE_INGRESS_SSH_KEY must be set"
            exit 1
          fi
          printf '%s\n' "${INGRESS_KEY}" > ~/.ssh/ragforge_ingress_key
          printf '%s\n' "${APP_KEY}" > ~/.ssh/ragforge_app_key
          chmod 600 ~/.ssh/ragforge_ingress_key ~/.ssh/ragforge_app_key

          INGRESS="${INGRESS_HOST_VALUE:-root@8.163.63.222}"
          APP="${APP_HOST_VALUE:-root@8.138.191.228}"
          INGRESS_HOST="${INGRESS#*@}"
          APP_HOST="${APP#*@}"
          if [[ "${INGRESS}" == *@* ]]; then
            INGRESS_USER="${INGRESS%@*}"
          else
            INGRESS_USER="root"
          fi
          if [[ "${APP}" == *@* ]]; then
            APP_USER="${APP%@*}"
          else
            APP_USER="root"
          fi
          INGRESS_PORT="${INGRESS_PORT_VALUE:-22}"
          APP_PORT="${APP_PORT_VALUE:-22}"
          ssh-keyscan -p "${INGRESS_PORT}" "${INGRESS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            printf '%s\n' 'Host ragforge-ingress'
            printf '%s\n' "  HostName ${INGRESS_HOST}"
            printf '%s\n' "  User ${INGRESS_USER}"
            printf '%s\n' "  Port ${INGRESS_PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/ragforge_ingress_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' ''
            printf '%s\n' 'Host ragforge-app'
            printf '%s\n' "  HostName ${APP_HOST}"
            printf '%s\n' "  User ${APP_USER}"
            printf '%s\n' "  Port ${APP_PORT}"
            printf '%s\n' '  IdentityFile ~/.ssh/ragforge_app_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  ProxyJump ragforge-ingress'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Verify SSH connectivity
        run: |
          ssh ragforge-ingress 'echo ragforge-ingress-ok'
          ssh ragforge-app 'echo ragforge-app-ok'

      - name: Deploy (three-tier)
        env:
          RAGFORGE_INGRESS_HOST: ragforge-ingress
          RAGFORGE_APP_HOST: ragforge-app
          RAGFORGE_INGRESS_DIR: ${{ secrets.RAGFORGE_INGRESS_DIR }}
          RAGFORGE_APP_DIR: ${{ secrets.RAGFORGE_APP_DIR }}
          APP_HOST: ${{ secrets.APP_HOST }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SSH_OPTS: "-o StrictHostKeyChecking=accept-new"
          SKIP_BUILD: "1"
        run: ./deploy.sh

  postdeploy-playwright:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run post-deploy Playwright smoke test
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.RAGFORGE_BASE_URL || 'http://8.163.63.222' }}
          PLAYWRIGHT_API_BASE_URL: ${{ vars.RAGFORGE_API_BASE_URL || 'http://8.163.63.222/api/v1' }}
        run: npm run test:e2e:cloud

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-playwright-postdeploy-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragforge-playwright-postdeploy-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
