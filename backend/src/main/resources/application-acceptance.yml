spring:
  config:
    import: optional:file:backend/.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ragforge}
    username: ${POSTGRES_USER:amy}
    password: ${POSTGRES_PASSWORD:amy}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
      file-size-threshold: 1MB
  data:
    redis:
      host: ${REDIS_HOST:8.148.217.153}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  task:
    scheduling:
      enabled: false

server:
  port: 0

storage:
  backend: aliyun
  aliyun:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
    bucket: ${ALIYUN_OSS_BUCKET:rag-raw-docs}
    accessKeyId: ${ALIYUN_OSS_AK}
    accessKeySecret: ${ALIYUN_OSS_SK}
  local:
    rootPath: ${RAGFORGE_UPLOAD_PATH:/data/files}

elasticsearch:
  host: ${ELASTICSEARCH_HOST:8.138.236.28}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: ${ELASTICSEARCH_SCHEME:http}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:8.148.217.153:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:ragforge-producer}
  consumer:
    listeners:
      ragforge-doc-process-group:
        ragforge-document-process: false

mybatis-plus:
  type-aliases-package: com.ragforge.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

ragforge:
  auth:
    jwks-url: ${RAGFORGE_AUTH_JWKS_URL:http://127.0.0.1:8090/.well-known/jwks.json}

logging:
  level:
    root: INFO
    com.ragforge.tools: INFO
    com.ragforge.mapper: WARN
