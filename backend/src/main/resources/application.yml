spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  application:
    name: rag-forge
  ai:
    mcp:
      server:
        name: ragforge-mcp-server
        version: 1.0.0
        type: SYNC
        sse-message-endpoint: /mcp/message
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    # 已有库（docker initdb / 手工建表）首次接入 Flyway 时打 baseline，跳过 V1，从 V2 起增量执行
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  cache:
    type: caffeine
    cache-names: queryRewrite
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: rag-forge

ragforge:
  auth:
    issuer: ${RAGFORGE_AUTH_ISSUER:https://auth.careermate.cn}
    audiences:
      - ${RAGFORGE_AUTH_AUDIENCE:ragforge-admin-api}
      - ragforge-search-api
    jwks-url: ${RAGFORGE_AUTH_JWKS_URL:http://auth.careermate.cn/.well-known/jwks.json}
    jwks-cache-ttl-ms: ${RAGFORGE_AUTH_JWKS_CACHE_TTL_MS:3600000}
    clock-skew-seconds: 60
    events:
      hmac-secret: ${RAGFORGE_AUTH_EVENT_HMAC_SECRET:dev-secret-must-match-authgw}
      signature-header: ${RAGFORGE_AUTH_EVENT_SIGNATURE_HEADER:X-Auth-Event-Signature}
      timestamp-header: ${RAGFORGE_AUTH_EVENT_TIMESTAMP_HEADER:X-Auth-Event-Timestamp}
      max-clock-skew: 300s
      idempotency-ttl: ${RAGFORGE_AUTH_EVENT_IDEMPOTENCY_TTL:7d}
      revoked-jti-ttl: ${RAGFORGE_AUTH_REVOKED_JTI_TTL:7d}
      user-revocation-ttl: ${RAGFORGE_AUTH_USER_REVOCATION_TTL:30d}
  files:
    upload-path: /data/files/
  eval:
    max-concurrent-questions: 4
    question-timeout-ms: 30000
  retrieval:
    executor-core-size: ${RAGFORGE_RETRIEVAL_CORE_SIZE:4}
    executor-max-size: ${RAGFORGE_RETRIEVAL_MAX_SIZE:12}
    executor-queue-capacity: ${RAGFORGE_RETRIEVAL_QUEUE_CAPACITY:100}
    stage-timeout-ms: ${RAGFORGE_RETRIEVAL_STAGE_TIMEOUT_MS:8000}
    keyword:
      max-concurrent: ${RAGFORGE_RETRIEVAL_KEYWORD_CONCURRENCY:20}
      timeout-ms: ${RAGFORGE_RETRIEVAL_KEYWORD_TIMEOUT_MS:5000}
    vector:
      max-concurrent: ${RAGFORGE_RETRIEVAL_VECTOR_CONCURRENCY:5}
      timeout-ms: ${RAGFORGE_RETRIEVAL_VECTOR_TIMEOUT_MS:8000}
    hybrid:
      max-concurrent: ${RAGFORGE_RETRIEVAL_HYBRID_CONCURRENCY:5}
      timeout-ms: ${RAGFORGE_RETRIEVAL_HYBRID_TIMEOUT_MS:12000}
    full:
      max-concurrent: ${RAGFORGE_RETRIEVAL_FULL_CONCURRENCY:1}
      timeout-ms: ${RAGFORGE_RETRIEVAL_FULL_TIMEOUT_MS:15000}
    rewrite:
      max-concurrent: ${RAGFORGE_RETRIEVAL_REWRITE_CONCURRENCY:3}
      timeout-ms: ${RAGFORGE_RETRIEVAL_REWRITE_TIMEOUT_MS:10000}

server:
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:160}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}

app:
  api-key:
    header: X-API-Key
    whitelist-paths:
      - /api/v1/health
      - /api/v1/admin/api-keys
      - /api/v1/admin/api-keys/
      - /api/v1/admin/api-keys
      - /api/v1/admin/api-keys/
  file:
    storage-path: ./data/files
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:your-key-here}
    model: text-embedding-v4
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    rewrite-model: qwen-turbo
    rerank-model: qwen3-rerank
    batch-size: 10
    timeout: 30000
    llm-timeout-ms: ${DASHSCOPE_LLM_TIMEOUT_MS:60000}
    min-request-interval-ms: 0
    max-concurrent-requests: 1

reranker:
  base-url: ${RERANKER_BASE_URL:http://localhost:8001}

mybatis-plus:
  type-aliases-package: com.ragforge.model.entity
  type-handlers-package: com.ragforge.config.handler
  configuration:
    map-underscore-to-camel-case: true

# RocketMQ（dev 默认连本机 NameServer；与 spring.* 同级，勿写在 spring 下）
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:ragforge-producer}

# dev 环境详见 application-dev.yml（本机 PG/MQ + ECS ES，不依赖 docker-compose）

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ragforge}
    username: ${SPRING_DATASOURCE_USERNAME:ragforge}
    password: ${SPRING_DATASOURCE_PASSWORD:ragforge}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1

  sql:
    init:
      mode: never

elasticsearch:
  host: ${ELASTICSEARCH_HOST:elasticsearch}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: ${ELASTICSEARCH_SCHEME:http}

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:rocketmq-namesrv:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:ragforge-producer}

ragforge:
  files:
    upload-path: ${RAGFORGE_UPLOAD_PATH:/data/files/}

logging:
  level:
    root: DEBUG
