spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  application:
    name: rag-forge
  ai:
    mcp:
      server:
        name: ragforge-mcp-server
        version: 1.0.0
        type: SYNC
        sse-message-endpoint: /mcp/message
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    # 已有库（docker initdb / 手工建表）首次接入 Flyway 时打 baseline，跳过 V1，从 V2 起增量执行
    baseline-on-migrate: true
    baseline-version: 26
    validate-on-migrate: true
    ignore-migration-patterns: "versioned:missing"
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
      file-size-threshold: 1MB
  cache:
    type: caffeine
    cache-names: queryRewrite
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: rag-forge

ragforge:
  role: ${RAGFORGE_ROLE:all}
  auth:
    issuer: ${RAGFORGE_AUTH_ISSUER:https://auth.careermate.cn}
    audiences:
      - ${RAGFORGE_AUTH_AUDIENCE:ragforge-admin-api}
      - ragforge-search-api
      - ragforge-api
    jwks-url: ${RAGFORGE_AUTH_JWKS_URL:http://auth.careermate.cn/.well-known/jwks.json}
    jwks-cache-ttl-ms: ${RAGFORGE_AUTH_JWKS_CACHE_TTL_MS:3600000}
    clock-skew-seconds: 60
    events:
      hmac-secret: ${RAGFORGE_AUTH_EVENT_HMAC_SECRET:dev-secret-must-match-authgw}
      signature-header: ${RAGFORGE_AUTH_EVENT_SIGNATURE_HEADER:X-Auth-Event-Signature}
      timestamp-header: ${RAGFORGE_AUTH_EVENT_TIMESTAMP_HEADER:X-Auth-Event-Timestamp}
      max-clock-skew: 300s
      idempotency-ttl: ${RAGFORGE_AUTH_EVENT_IDEMPOTENCY_TTL:7d}
      revoked-jti-ttl: ${RAGFORGE_AUTH_REVOKED_JTI_TTL:7d}
      user-revocation-ttl: ${RAGFORGE_AUTH_USER_REVOCATION_TTL:30d}
    proxy:
      base-url: ${RAGFORGE_AUTH_PROXY_BASE_URL:http://auth-gateway.auth-gateway.svc.cluster.local:8090}
      client-id: ${RAGFORGE_AUTH_PROXY_CLIENT_ID:ragforge-admin-backend}
      target-audience: ${RAGFORGE_AUTH_PROXY_TARGET_AUDIENCE:ragforge-admin-api}
      token-endpoint-audience: ${RAGFORGE_AUTH_PROXY_TOKEN_ENDPOINT_AUDIENCE:https://auth.careermate.cn/oauth/token}
      client-assertion-private-key: ${RAGFORGE_AUTH_PROXY_CLIENT_ASSERTION_PRIVATE_KEY:}
      client-assertion-kid: ${RAGFORGE_AUTH_PROXY_CLIENT_ASSERTION_KID:ragforge-admin-backend}
      public-key-pem: ${RAGFORGE_AUTH_PROXY_PUBLIC_KEY_PEM:}
      cookie-secure: ${RAGFORGE_AUTH_PROXY_COOKIE_SECURE:true}
  files:
    upload-path: /data/files/
  document-processing:
    # mq: publish to RocketMQ worker; inline: dispatch asynchronously in-process for local/E2E without MQ
    dispatch-mode: ${RAGFORGE_DOCUMENT_PROCESS_DISPATCH_MODE:mq}
  judge:
    dispatch-mode: ${RAGFORGE_JUDGE_DISPATCH_MODE:mq}
    sampling-fallback-rate: 0.0
    aggregator-enabled: ${RAGFORGE_JUDGE_AGGREGATOR_ENABLED:true}
    golden-replay:
      enabled: ${RAGFORGE_JUDGE_GOLDEN_REPLAY_ENABLED:true}
      cron: ${RAGFORGE_JUDGE_GOLDEN_REPLAY_CRON:0 0 3 * * *}
    cost-guard:
      # Set false in local/debug environments to disable scheduled judge cost budget alerts.
      enabled: ${RAGFORGE_JUDGE_COST_GUARD_ENABLED:true}
      monthly-budget-cny: ${RAGFORGE_JUDGE_MONTHLY_BUDGET:200}
      warn-threshold: 0.8
      critical-threshold: 1.0
    stability-check:
      enabled: false
  eval:
    max-concurrent-questions: 4
    question-timeout-ms: 30000
  retrieval:
    executor-core-size: ${RAGFORGE_RETRIEVAL_CORE_SIZE:4}
    executor-max-size: ${RAGFORGE_RETRIEVAL_MAX_SIZE:12}
    executor-queue-capacity: ${RAGFORGE_RETRIEVAL_QUEUE_CAPACITY:100}
    stage-timeout-ms: ${RAGFORGE_RETRIEVAL_STAGE_TIMEOUT_MS:8000}
    keyword:
      max-concurrent: ${RAGFORGE_RETRIEVAL_KEYWORD_CONCURRENCY:20}
      timeout-ms: ${RAGFORGE_RETRIEVAL_KEYWORD_TIMEOUT_MS:5000}
    vector:
      max-concurrent: ${RAGFORGE_RETRIEVAL_VECTOR_CONCURRENCY:5}
      timeout-ms: ${RAGFORGE_RETRIEVAL_VECTOR_TIMEOUT_MS:8000}
    hybrid:
      max-concurrent: ${RAGFORGE_RETRIEVAL_HYBRID_CONCURRENCY:5}
      timeout-ms: ${RAGFORGE_RETRIEVAL_HYBRID_TIMEOUT_MS:12000}
    full:
      max-concurrent: ${RAGFORGE_RETRIEVAL_FULL_CONCURRENCY:1}
      timeout-ms: ${RAGFORGE_RETRIEVAL_FULL_TIMEOUT_MS:15000}
    rewrite:
      max-concurrent: ${RAGFORGE_RETRIEVAL_REWRITE_CONCURRENCY:3}
      timeout-ms: ${RAGFORGE_RETRIEVAL_REWRITE_TIMEOUT_MS:10000}

embedding:
  api-key: ${DASHSCOPE_API_KEY:}
  vl:
    model: qwen3-vl-embedding
    endpoint: https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding
    timeoutMs: 15000
    batchSize: 10
  ocr:
    model: qwen-vl-ocr
    endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
    timeoutMs: 30000
  image-processing:
    enabled: ${RAGFORGE_MULTIMODAL_ENABLED:true}
    timeout-ms: ${RAGFORGE_MULTIMODAL_TIMEOUT_MS:30000}
    max-concurrent: ${RAGFORGE_MULTIMODAL_MAX_CONCURRENT:1}
    embedded:
      min-image-bytes: ${RAGFORGE_EMBEDDED_IMAGE_MIN_BYTES:8192}
      max-concurrent-image-tasks: ${RAGFORGE_EMBEDDED_IMAGE_MAX_CONCURRENT:3}
      max-processing-ms-per-doc: ${RAGFORGE_EMBEDDED_IMAGE_MAX_PROCESSING_MS_PER_DOC:120000}

server:
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:160}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}

app:
  api-key:
    header: X-API-Key
    whitelist-paths:
      - /api/v1/health
  file:
    storage-path: ./data/files
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:your-key-here}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    rewrite-model: qwen-turbo
    rerank-model: qwen3-rerank
    llm-timeout-ms: ${DASHSCOPE_LLM_TIMEOUT_MS:60000}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    temperature: 0.0
    timeout-ms: 30000
    max-retries: 3
    retry-backoff-ms: 2000

reranker:
  base-url: ${RERANKER_BASE_URL:http://localhost:8001}

storage:
  aliyun:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
    bucket: ${ALIYUN_OSS_BUCKET:rag-raw-docs}
    accessKeyId: ${ALIYUN_OSS_AK:}
    accessKeySecret: ${ALIYUN_OSS_SK:}
  local:
    rootPath: ${RAGFORGE_UPLOAD_PATH:${app.file.storage-path:./data/files}}

mybatis-plus:
  type-aliases-package: com.ragforge.model.entity
  type-handlers-package: com.ragforge.config.handler
  configuration:
    map-underscore-to-camel-case: true

# RocketMQ（dev 默认连本机 NameServer；与 spring.* 同级，勿写在 spring 下）
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:ragforge-producer}

# dev 环境详见 application-dev.yml（本机 PG/MQ + ECS ES，不依赖 docker-compose）

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ragforge}
    username: ${SPRING_DATASOURCE_USERNAME:ragforge}
    password: ${SPRING_DATASOURCE_PASSWORD:ragforge}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1

  sql:
    init:
      mode: never

elasticsearch:
  host: ${ELASTICSEARCH_HOST:elasticsearch}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: ${ELASTICSEARCH_SCHEME:http}

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:rocketmq-namesrv:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:ragforge-producer}

ragforge:
  files:
    upload-path: ${RAGFORGE_UPLOAD_PATH:/data/files/}

logging:
  level:
    root: DEBUG
