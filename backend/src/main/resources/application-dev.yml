# 本地开发：本机 PostgreSQL / RocketMQ；Redis / Elasticsearch 走 ECS（8.148.217.153 / 8.138.236.28，不依赖 docker-compose）
# 使用前请复制 backend/.env.example 为 backend/.env 并填写敏感项

spring:
  config:
    import: optional:file:backend/.env[.properties],optional:file:.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:8.148.217.153}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ragforge}
    username: ${POSTGRES_USER:amy}
    password: ${POSTGRES_PASSWORD:amy}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1

  sql:
    init:
      mode: never
      schema-locations: classpath:db/init/schema.sql
      continue-on-error: true

  output:
    ansi:
      enabled: always

# 本机 Elasticsearch（默认 localhost:9200，无认证）
elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: ${ELASTICSEARCH_SCHEME:http}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}

# 本机 RocketMQ：需同时启动 NameServer + Broker，否则会出现 No route info of this topic
#   cd ~/rocketmq-5.5.0 && sh bin/mqnamesrv
#   cd ~/rocketmq-5.5.0 && sh bin/mqbroker -n 127.0.0.1:9876 -c conf/broker.conf autoCreateTopicEnable=true
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:ragforge-producer}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.ragforge: DEBUG
    com.ragforge.mapper: DEBUG
    com.ragforge.search: INFO

ragforge:
  auth:
    jwks-url: ${RAGFORGE_AUTH_JWKS_URL:http://127.0.0.1:8090/.well-known/jwks.json}

storage:
  backend: aliyun
  aliyun:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-shenzhen.aliyuncs.com}
    bucket: ${ALIYUN_OSS_BUCKET:ragforge-dev}
    accessKeyId: ${ALIYUN_OSS_AK}
    accessKeySecret: ${ALIYUN_OSS_SK}
  local:
    rootPath: ${RAGFORGE_UPLOAD_PATH:/data/files}
