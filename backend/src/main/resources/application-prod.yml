spring:
  security:
    user:
      name: metrics-reader
      password: ${METRICS_READER_PASSWORD:}
      roles: METRICS_READER

  data:
    redis:
      host: ${REDIS_HOST:172.25.90.183}
      port: ${REDIS_PORT:6379}
      # 口令由 k8s Secret ragforge-backend-env 注入,默认空以便本地免密 Redis 起得来。
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:172.25.90.183}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ragforge}
    username: ${POSTGRES_USER:ragforge}
    password: ${POSTGRES_PASSWORD:ragforge}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:2000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  sql:
    init:
      mode: never

  output:
    ansi:
      enabled: always

elasticsearch:
  host: ${ELASTICSEARCH_HOST:172.25.90.183}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: ${ELASTICSEARCH_SCHEME:http}

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:172.25.90.183:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:ragforge-producer}

reranker:
  base-url: ${RERANKER_BASE_URL:http://172.25.90.183:8001}

app:
  file:
    storage-path: /data/files

ragforge:
  files:
    upload-path: /data/files/
  judge:
    aggregator-enabled: ${RAGFORGE_JUDGE_AGGREGATOR_ENABLED:true}
    golden-replay:
      enabled: ${RAGFORGE_JUDGE_GOLDEN_REPLAY_ENABLED:true}
      cron: ${RAGFORGE_JUDGE_GOLDEN_REPLAY_CRON:0 0 3 * * *}
    cost-guard:
      enabled: ${RAGFORGE_JUDGE_COST_GUARD_ENABLED:true}
      monthly-budget-cny: ${RAGFORGE_JUDGE_MONTHLY_BUDGET:200}
      warn-threshold: ${RAGFORGE_JUDGE_COST_WARN_THRESHOLD:0.8}
      critical-threshold: ${RAGFORGE_JUDGE_COST_CRITICAL_THRESHOLD:1.0}
  auth:
    # In-cluster Auth Gateway is reachable; auth.careermate.cn is not resolvable from pods.
    jwks-url: ${RAGFORGE_AUTH_JWKS_URL:http://auth-gateway.auth-gateway.svc.cluster.local:8090/.well-known/jwks.json}

storage:
  backend: aliyun
  aliyun:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-shenzhen.aliyuncs.com}
    bucket: ${ALIYUN_OSS_BUCKET:ragforge-prod}
    accessKeyId: ${ALIYUN_OSS_AK}
    accessKeySecret: ${ALIYUN_OSS_SK}
  local:
    rootPath: ${RAGFORGE_UPLOAD_PATH:/data/files}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.ragforge: INFO
    com.ragforge.search: INFO
