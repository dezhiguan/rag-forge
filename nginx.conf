    location = /favicon.ico {
        proxy_pass http://172.25.90.184:18088/favicon.ico;
        proxy_set_header Host 172.25.90.184;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # [FrontendK8s-MIGRATED 2026-06-19] 前端已迁移到 K8s NodePort 31002，由反向代理转发。
    # 恢复方法：取消注释保留下方原 root/try_files 行，删除上方 proxy_pass 块。
    location / {
        proxy_pass http://172.25.90.184:31002;
        proxy_set_header Host 172.25.90.184;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    # 原静态托管配置（保留备恢复）：
    # location / {
    #     root /usr/share/nginx/html;
    #     try_files $uri $uri/ /index.html;
    # }

    location /api/ {
        proxy_pass http://ragforge_backend;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /careermate/ {
        return 301 https://careerforge.cn/;
    }

    location /careermate-api/ {
        proxy_pass http://172.25.90.184:31080/api/;
        proxy_set_header Host careerforge.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
