    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 300s;
    # }

    # favicon 之前指向 18088（SkyWalking），SkyWalking 已停（见 [SkyWalking-OFF 2026-06-19]），
    # 现在指向前端 NodePort，避免控制台 502 干扰排查。
