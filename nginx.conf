# BEGIN RAGFORGE_BACKEND_UPSTREAM
upstream ragforge_backend {
    least_conn;
    server 172.25.90.184:31090;
    keepalive 32;
}
# END RAGFORGE_BACKEND_UPSTREAM

# BEGIN CAREERMATE_BACKEND_UPSTREAM
# ip_hash keeps Agent SSE / in-memory task state on one replica per client IP.
upstream careermate_backend {
    ip_hash;
    server 172.25.90.184:31080;
    keepalive 32;
}
# END CAREERMATE_BACKEND_UPSTREAM

# www → HTTPS 裸域名（RAGForge）
server {
    listen 80;
    server_name www.ragforge.net;
    return 301 https://ragforge.net$request_uri;
}

# HTTP → HTTPS（RAGForge）
server {
    listen 80;
    server_name ragforge.net;
    return 301 https://ragforge.net$request_uri;
}

server {
    listen 443 ssl;
    server_name www.ragforge.net;

    ssl_certificate     /etc/nginx/ssl/ragforge/www.ragforge.net.pem;
    ssl_certificate_key /etc/nginx/ssl/ragforge/www.ragforge.net.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://ragforge.net$request_uri;
}

# RAGForge — ragforge.net
server {
    listen 443 ssl;
    server_name ragforge.net;

    ssl_certificate     /etc/nginx/ssl/ragforge/www.ragforge.net.pem;
    ssl_certificate_key /etc/nginx/ssl/ragforge/www.ragforge.net.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---- 安全响应头（SEC-BB-01 / 02 / 08）----
    # 注意 nginx add_header 继承规则：带自身 add_header 的 location（如 = /index.html、/api/v1/answer、
    # = /mcp、通知流、favicon）不会继承 server 级 add_header。主文档经 location /（无自身 add_header）继承本组；
    # = /index.html 单独重复一份（见下）。其余为流式/静态端点，缺文档类头无安全影响。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    server_tokens off;

    client_max_body_size 50m;

    # /login 是 SPA 真实路由（登录页），不能 302 到 /：
    # 会剥掉 ?reason=expired 等 query，导致会话过期/重置成功横幅失效。
    # （早期此规则用于遮挡废弃后台入口，遗留误伤，2026-07-05 移除）

    location = /admin/login.html {
        return 302 /;
    }

    location ^~ /admin-api/ {
        return 404;
    }

    location ^~ /api/auth/ {
        proxy_pass http://ragforge_backend;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # SSE 流式端点：POST /api/v1/answer 产 token-by-token chunked。
    # 不能走下方通用 /api/ 块（proxy_buffering on + read_timeout 60s 会把长流截断成
    # ERR_INCOMPLETE_CHUNKED_ENCODING）。配置参照 /sse 块 + Anthropic LLM 流式延长 timeout。
    location ^~ /api/v1/answer {
        proxy_pass http://ragforge_backend;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：长连接 + 关闭一切代理侧缓冲，让 chunk 立刻吐给浏览器
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
        gzip off;

        # LLM 流首 token 可能 3-5s，整体可达几分钟；timeout 必须远长于 60s
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SSE 站内通知未读数推送：GET /api/v1/notifications/stream（EventSource，token 走 query param）。
    # 必须先于下方通用 /api/ 块，且关闭代理缓冲、延长 read_timeout（须 > 服务端 25s 心跳），
    # 否则长连接会被通用块的 60s read_timeout 掐断。
    location ^~ /api/v1/notifications/stream {
        proxy_pass http://ragforge_backend;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
        gzip off;

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /actuator/ {
        proxy_pass http://ragforge_backend;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location = /mcp {
        proxy_pass http://ragforge_backend;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cursor/Claude 等 MCP 客户端在 initialize 后可能请求 /mcp/（尾斜杠）。
    # 若落到下方 location / 会返回 SPA HTML，客户端解析 JSON 失败并显示 Error。
    location = /mcp/ {
        proxy_pass http://ragforge_backend/mcp;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # MCP 客户端 OAuth discovery：RAGForge 仅支持 X-API-Key，无 OAuth 服务器。
    # 返回 JSON 404，避免 location / 回退 SPA HTML 误导客户端。
    location = /.well-known/oauth-authorization-server {
        default_type application/json;
        return 404 '{"error":"not_found","message":"RAGForge MCP uses API key auth on POST /mcp"}';
    }

    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        return 404 '{"error":"not_found","message":"RAGForge MCP uses API key auth on POST /mcp"}';
    }

    location = /.well-known/openid-configuration {
        default_type application/json;
        return 404 '{"error":"not_found","message":"RAGForge MCP uses API key auth on POST /mcp"}';
    }

    location = /.well-known/mcp.json {
        default_type application/json;
        return 404 '{"error":"not_found","message":"RAGForge MCP uses API key auth on POST /mcp"}';
    }

    location ^~ /mcp/.well-known/ {
        default_type application/json;
        return 404 '{"error":"not_found","message":"RAGForge MCP uses API key auth on POST /mcp"}';
    }

    # Cursor 误走 OAuth 时会对这些路径发 POST；SPA location / 对 POST 返回 nginx HTML 405。
    # 显式 JSON，避免 Invalid OAuth error response / Unexpected token '<'。
    # GET /authorize、/register 仍走前端（可能是 SPA 路由）；非 GET 返回 JSON 404。
    location = /authorize {
        default_type application/json;
        if ($request_method != GET) {
            return 404 '{"error":"not_found","message":"RAGForge MCP uses API key auth on POST /mcp"}';
        }
        proxy_pass http://172.25.90.184:31002;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /token {
        default_type application/json;
        return 404 '{"error":"not_found","message":"RAGForge MCP uses API key auth on POST /mcp"}';
    }

    location = /oauth/token {
        default_type application/json;
        return 404 '{"error":"not_found","message":"RAGForge MCP uses API key auth on POST /mcp"}';
    }

    location = /oauth/authorize {
        default_type application/json;
        return 404 '{"error":"not_found","message":"RAGForge MCP uses API key auth on POST /mcp"}';
    }

    location = /register {
        default_type application/json;
        if ($request_method != GET) {
            return 404 '{"error":"not_found","message":"RAGForge MCP uses API key auth on POST /mcp"}';
        }
        proxy_pass http://172.25.90.184:31002;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /sse 与 /mcp/message（旧 HTTP+SSE MCP 传输）已下线：SSE 已被 MCP 标准弃用，
    # 且多副本会话内存态不粘导致 404/堆栈外泄。三个工具统一走无状态 /mcp（location = /mcp）。

    location = /api {
        proxy_pass http://172.25.90.184:31002;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/ {
        proxy_pass http://172.25.90.184:31002;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        proxy_pass http://172.25.90.184:31002;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 本 location 有自身 add_header，需重复安全响应头（nginx 不继承 server 级 add_header）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store";
    }

    # [SkyWalking-OFF 2026-06-19] 临时停用 SkyWalking 路由（服务端已 docker stop）。
    # 恢复方法：grep '[SkyWalking-OFF 2026-06-19]' nginx.conf 找到所有点，取消下方注释。
    # [SkyWalking-OFF 2026-06-19]
    # # SkyWalking UI on Server 3 (see deploy/nginx/skywalking.locations.snippet)
    # location = /skywalking {
    #     return 301 /skywalking/;
    # }
    #
    # [SkyWalking-OFF 2026-06-19]
    # location /skywalking/ {
    #     proxy_pass http://172.25.90.184:18088/skywalking/;
    #     proxy_set_header Host ragforge.net;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 300s;
    # }
    #
    # [SkyWalking-OFF 2026-06-19]
    # # SkyWalking UI router base is hardcoded to "/" in upstream JS; patch for /skywalking/ subpath.
    # location = /static/js/index-CElEPs2H.js {
    #     alias /usr/share/nginx/html/skywalking-patched/index-CElEPs2H.js;
    #     default_type application/javascript;
    #     add_header Cache-Control "no-store";
    # }
    #
    # [SkyWalking-OFF 2026-06-19]
    # # SkyWalking UI 10.x emits root-absolute /static/, /graphql, /monacoeditorwork/ paths.
    # location ^~ /static/ {
    #     proxy_pass http://172.25.90.184:18088/static/;
    #     proxy_set_header Host ragforge.net;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     add_header Cache-Control "no-store";
    #     proxy_read_timeout 300s;
    # }
    #
    # [SkyWalking-OFF 2026-06-19]
    # location ^~ /monacoeditorwork/ {
    #     proxy_pass http://172.25.90.184:18088/monacoeditorwork/;
    #     proxy_set_header Host ragforge.net;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 300s;
    # }
    #
    # [SkyWalking-OFF 2026-06-19]
    # location = /graphql {
    #     proxy_pass http://172.25.90.184:18088/graphql;
    #     proxy_set_header Host ragforge.net;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 300s;
    # }

    # favicon 之前指向 18088（SkyWalking），SkyWalking 已停（见 [SkyWalking-OFF 2026-06-19]），
    # 现在指向前端 NodePort，避免控制台 502 干扰排查。
    location = /favicon.ico {
        proxy_pass http://172.25.90.184:31002/favicon.ico;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        access_log off;
        log_not_found off;
    }

    # [FrontendK8s-MIGRATED 2026-06-19] 前端已迁移到 K8s NodePort 31002，由反向代理转发。
    # 恢复方法：取消注释保留下方原 root/try_files 行，删除上方 proxy_pass 块。
    location / {
        proxy_pass http://172.25.90.184:31002;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    # 原静态托管配置（保留备恢复）：
    # location / {
    #     root /usr/share/nginx/html;
    #     try_files $uri $uri/ /index.html;
    # }

    # RAGForge API → 应用层 upstream
    location /api/ {
        proxy_pass http://ragforge_backend;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}


# ===========================================================================
# askdb —— 可信数据问答 Agent（对外开放实例）
#
# 后端在 Server 3 的 k3s 里（namespace askdb，NodePort 31100）。
#
# ⚠️ 上面那句"连的是合成样例库、且有意不接模型"已经**不成立**，别照着读：
#    2026-09-03 起直连 ragforge 生产主库，2026-09-07 起又加了 careermate
#    生产库，且两个源都接了模型（qwen3.8-flash）。因此这一段限流现在同时
#    承担两件事：挡住真实数据被批量抓走，以及兜住模型账单。
#
# ---------------------------------------------------------------------------
# 2026-09-09 按日访问量 10 万级重做限流（@guandezhi）
#
# 容量口径（改这些数字之前先回到这里，否则只是在猜）：
#   · 100,000 PV/天，每次 PV 约 10 个请求（冷启 3 个静态 + 约 7 个只读接口）
#     → 约 1,000,000 请求/天
#   · 峰值小时按全天 15% 估 → 150,000 请求/时 ≈ **42 r/s**
#   · 峰值分钟按峰值小时的 3 倍估 → **约 125 r/s** 的短时尖峰
#
# 原来是**一档 5 r/s burst 10 打在所有路径上**，在这个量级下有两处会直接出事：
#   1. 一次冷加载本身就要发 11 个请求，burst 10 当场就顶到 429 —— 不是被刷，
#      是正常打开首页就被自己的限流挡住。
#   2. $binary_remote_addr 在 NAT / 运营商 CGNAT 后面是**一群人共用一个键**。
#      校园网或企业出口后面几十个人，合起来轻松超过 5 r/s，于是整片人一起被锁。
#
# 所以改成按"这一次请求花掉什么"分三档，而不是所有路径一个价：
#   askdb_web  静态资源 + 只读接口：花 CPU 和一次 PG 查询，最便宜，给得最松
#   askdb_sql  /api/sql 直查：花 sqlglot 解析 + 一条真实 SQL，中间档
#   askdb_ask  /api/ask 模型入口：**花钱**，最贵，按分钟计
#
# 分档之后 NAT 那条依然存在（per-IP 限流治不了共用出口），但被挡住的只会是
# 最贵的那一档，普通浏览不再受影响 —— 这是 per-IP 方案能做到的上限。
# 真要按人限，得先有账号体系，而这个实例有意不设（auth.required: false）。
# ---------------------------------------------------------------------------

# 限流 zone 必须声明在 http 上下文。rag-forge 的 nginx.conf 本身就是被
# include 进 http 块的片段（开头即 upstream），所以放这里是对的；
# 但它是**全局命名**的，合并时注意别与将来别处的同名 zone 冲突。
#
# zone 大小按"能装下一天的独立 IP"算：$binary_remote_addr 每个状态约 64 字节，
# 16m ≈ 26 万个 IP，10 万 PV 对应的独立 IP 远低于此。给小了的后果不是报错，
# 是 nginx 开始淘汰最老的状态并打 warn，限流随之出现空洞。
limit_req_zone  $binary_remote_addr zone=askdb_web:16m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=askdb_sql:10m rate=2r/s;
limit_req_zone  $binary_remote_addr zone=askdb_ask:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=askdb_conn:10m;

# 静态资源在入口层缓存。构建产物文件名带内容 hash，改一版就是新文件名，
# 因此可以放心长期缓存 —— 这一项直接决定后端 Pod 要不要为每个新访客重发
# 一遍 290KB 的 JS。10 万 PV 里冷启占比不低，不缓存的话这部分全压在两个
# Python 进程的事件循环上，而它们本该去跑查询。
#
# ⚠️ 这条是 http 级指令，写错会让**整个 ingress**（含 ragforge / careerforge）
#    起不来。改完必须先 nginx -t 再 reload，别直接 restart。
proxy_cache_path /var/cache/nginx/askdb levels=1:2 keys_zone=askdb_assets:10m
                 max_size=512m inactive=7d use_temp_path=off;

# BEGIN ASKDB_UPSTREAM
upstream askdb_backend {
    server 172.25.90.184:31100 max_fails=3 fail_timeout=10s;
    # keepalive 16 是按"没什么人用"配的。42 r/s 下每秒要新建的连接数远超它，
    # 表现是大量 TIME_WAIT 与握手延迟叠在每个请求上。64 条常连足够覆盖峰值。
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}
# END ASKDB_UPSTREAM

server {
    listen 80;
    server_name askdb.ragforge.net www.askdb.ragforge.net;
    return 301 https://askdb.ragforge.net$request_uri;
}

server {
    listen 443 ssl;
    server_name askdb.ragforge.net;

    ssl_certificate     /etc/nginx/ssl/ragforge/askdb.ragforge.net.pem;
    ssl_certificate_key /etc/nginx/ssl/ragforge/askdb.ragforge.net.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 默认档：浏览页面与只读接口。30 r/s + burst 60 意味着单个 IP 可以连着
    # 打开五六个页面而不被挡，同时把"每秒上百次"的脚本挡在外面。
    limit_req zone=askdb_web burst=60 nodelay;
    limit_req_status 429;
    # 把 429 打进 error_log。没有这一条，限流是否在误伤真实用户只能靠猜。
    limit_req_log_level warn;

    # 并发连接数上限，防的是慢连接把 worker 占满（限速率治不了这个）。
    # 200 是按 NAT 出口给的：浏览器对单域名开 6 条连接，200 条约等于
    # 30 个共用出口的人同时在线，仍能挡住单机的连接洪水。
    limit_conn askdb_conn 200;
    limit_conn_status 429;

    client_max_body_size 64k;        # 只收 SQL 文本，不需要更大

    # 前端是独立构建的 React 工程，单次冷加载 290KB JS + 53KB CSS。
    # gzip 后是 88KB + 11KB —— 跨境访问这条链路上，这一项比什么都管用。
    #
    # ⚠️ 这段在 askdb 仓库的 deploy/nginx-askdb.conf 里写了很久，但**从未合并
    #    到本文件**，也就是说线上一直在发未压缩的 290KB。2026-09-09 补上。
    gzip on;
    # **必须有这一条**：gzip_proxied 默认 off，含义是"响应来自上游时不压缩"。
    # askdb 的一切都来自 proxy_pass，只写 gzip on 等于一个字节都没压。
    gzip_proxied  any;
    gzip_comp_level 5;               # 再高收益很小，CPU 却明显上去
    gzip_min_length 1024;
    gzip_vary on;                    # 让中间缓存按 Accept-Encoding 分开存
    # text/html 是默认项，再写一遍会告警重复
    gzip_types text/css text/javascript application/javascript application/json;

    location ^~ /assets/ {
        proxy_pass http://askdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              askdb.ragforge.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 让上游只回未压缩的那一份，压缩统一在这里做。
        # 不清掉这个头的话，上游哪天加了 gzip 中间件，缓存键（默认不含
        # Accept-Encoding）就会把 gzip 与非 gzip 两种响应体存成同一条 ——
        # 先到的那份发给所有人，不支持压缩的客户端拿到一坨二进制。
        # 现在上游没有压缩中间件，所以这一行是把将来那个坑提前填掉。
        proxy_set_header Accept-Encoding   "";

        proxy_cache askdb_assets;
        proxy_cache_valid 200 7d;
        # 同一个新文件同时被很多人请求时只回源一次，其余等这一次的结果。
        # 发版瞬间正是这种形状：所有人同时来拿同一个新 hash 的 JS。
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # 后端抖动时继续发旧副本，而不是把 502 给到用户。
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        # 静态资源本身就该被高频取，不占动态那档的额度。
        limit_req zone=askdb_web burst=120 nodelay;

        # 只用 add_header，不配 expires：expires 自己也会发一个 Cache-Control，
        # 两者并存会让响应里出现两条 Cache-Control，取哪条由客户端决定。
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # nginx 的 add_header 是**就近整组替换**，不是逐层追加：这个 location 里
        # 只要写了一条 add_header，server 块那四条安全头就全都不再下发。
        # 静态资源至少要把 nosniff 与 HSTS 补回来。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 模型入口。**这是唯一花钱的路径**，因此单独一档，且按分钟计。
    #
    # 2026-08-25 曾整档撤掉每 IP 限流，只留应用层 daily_quota 兜底。那个决定
    # 在 500 次/天的额度下代价有限；额度提到 2 万次/天之后，"单人几分钟刷光
    # 全天额度"就从"损失几块钱"变成"损失几十块并且让所有人当天用不了"。
    # 所以这一档加回来 —— 它挡的不是花钱本身，是**一个人把全站额度花光**。
    #
    # 20 r/m + burst 10 nodelay 的实际手感：先给 10 次立即放行，之后每 3 秒
    # 恢复一次。人正常提问远低于此；脚本连续刷会在第 11 次上撞到 429。
    #
    # ⚠️ 注意一处长期与注释不符的行为：nginx 的 limit_req **只在本层没有任何
    #    limit_req 时才继承上层**。原来 = /api/ask 里一条都没写，所以它其实
    #    一直在吃 server 块那条 5 r/s，而注释写的是"不做每 IP 限流"。
    #    现在两条都显式写出来，行为与注释一致。
    location = /api/ask {
        limit_req zone=askdb_ask burst=10 nodelay;
        limit_req zone=askdb_web burst=60 nodelay;

        proxy_pass http://askdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        # 写死域名，不用请求头里带过来的那个变量 —— 它由攻击者可控。
        # semgrep 的 generic.nginx.security.request-host-used 会拦下那种写法，
        # 且该规则是纯文本匹配、连注释里的变量名也算，所以这里不写出它。
        proxy_set_header Host              askdb.ragforge.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 必须比 askdb 的 agent.async_after_ms（60s）长：同步等满 60s 才交接后台，
        # 读超时若也是 60s，擦边的请求拿到的是 504，后台却照常跑完。
        proxy_read_timeout    90s;
    }

    # 直查 SQL。不花钱，但每一次都是**一条真打到生产库的语句**，外加
    # sqlglot 的 AST 解析（R-20 那条 4 秒 CPU 的实测就来自这里）。
    # 原来它落在 location / 的通用档里，跟拉一张图片同价 —— 这不对。
    # 2 r/s + burst 20：人改一句 SQL 再点一次远低于此，脚本连刷会被压住。
    location = /api/sql {
        limit_req zone=askdb_sql burst=20 nodelay;
        limit_req zone=askdb_web burst=60 nodelay;

        proxy_pass http://askdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              askdb.ragforge.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;      # 直查有 R-12 3s 超时兜底，30s 足够
    }

    location / {
        proxy_pass http://askdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              askdb.ragforge.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;      # 直查有 R-12 3s 超时兜底，30s 足够
    }

    # 自检与内省已放开（2026-08-25 运营决定）。
}

# www → HTTPS 裸域名（CareerForge）
server {
    listen 80;
    server_name www.careerforge.cn;
    return 301 https://careerforge.cn$request_uri;
}

# HTTP → HTTPS（CareerForge）
server {
    listen 80;
    server_name careerforge.cn;
    return 301 https://careerforge.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name www.careerforge.cn;

    ssl_certificate     /etc/nginx/ssl/careerforge/www.careerforge.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/careerforge/www.careerforge.cn.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://careerforge.cn$request_uri;
}

# CareerForge — careerforge.cn
