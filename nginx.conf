server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location = /login {
        return 302 /;
    }

    location = /admin/login.html {
        return 302 /;
    }

    location ^~ /admin-api/ {
        return 404;
    }

    location ^~ /api/auth/ {
        return 404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    # RAGForge 前端（根路径）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # RAGForge API → Server 3 应用层（172.25.90.184:8080）
    location /api/ {
        proxy_pass http://172.25.90.184:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # CareerMate 前端（由 CI 同步到 /usr/share/nginx/html/careermate/）
    location /careermate/ {
        alias /usr/share/nginx/html/careermate/;
        try_files $uri $uri/ /careermate/index.html;
    }

    # CareerMate API → Server 3 应用层（172.25.90.184:18080）
    location /careermate-api/ {
        proxy_pass http://172.25.90.184:18080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requirements
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
