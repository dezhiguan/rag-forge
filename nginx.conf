# BEGIN RAGFORGE_BACKEND_UPSTREAM
upstream ragforge_backend {
    least_conn;
    server 172.25.90.184:31090;
    keepalive 32;
}
# END RAGFORGE_BACKEND_UPSTREAM

# BEGIN CAREERMATE_BACKEND_UPSTREAM
# ip_hash keeps Agent SSE / in-memory task state on one replica per client IP.
upstream careermate_backend {
    ip_hash;
    server 172.25.90.184:31080;
    keepalive 32;
}
# END CAREERMATE_BACKEND_UPSTREAM

# www → HTTPS 裸域名（RAGForge）
server {
    listen 80;
    server_name www.ragforge.net;
    return 301 https://ragforge.net$request_uri;
}

# HTTP → HTTPS（RAGForge）
server {
    listen 80;
    server_name ragforge.net;
    return 301 https://ragforge.net$request_uri;
}

server {
    listen 443 ssl;
    server_name www.ragforge.net;

    ssl_certificate     /etc/nginx/ssl/ragforge/www.ragforge.net.pem;
    ssl_certificate_key /etc/nginx/ssl/ragforge/www.ragforge.net.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://ragforge.net$request_uri;
}

# RAGForge — ragforge.net
server {
    listen 443 ssl;
    server_name ragforge.net;

    ssl_certificate     /etc/nginx/ssl/ragforge/www.ragforge.net.pem;
    ssl_certificate_key /etc/nginx/ssl/ragforge/www.ragforge.net.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location = /login {
        return 302 /;
    }

    location = /admin/login.html {
        return 302 /;
    }

    location ^~ /admin-api/ {
        return 404;
    }

    location ^~ /api/auth/ {
        return 404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # RAGForge API → 应用层 upstream
    location /api/ {
        proxy_pass http://ragforge_backend;
        proxy_set_header Host ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}

# www → HTTPS 裸域名（CareerForge）
server {
    listen 80;
    server_name www.careerforge.cn;
    return 301 https://careerforge.cn$request_uri;
}

# HTTP → HTTPS（CareerForge）
server {
    listen 80;
    server_name careerforge.cn;
    return 301 https://careerforge.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name www.careerforge.cn;

    ssl_certificate     /etc/nginx/ssl/careerforge/www.careerforge.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/careerforge/www.careerforge.cn.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://careerforge.cn$request_uri;
}

# CareerForge — careerforge.cn
server {
    listen 443 ssl;
    server_name careerforge.cn;

    ssl_certificate     /etc/nginx/ssl/careerforge/www.careerforge.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/careerforge/www.careerforge.cn.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    # CareerMate k8s (Server 3 NodePort via private IP)
    location /careermate/ {
        proxy_pass http://172.25.90.184:31000/;
        proxy_set_header Host careerforge.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /careermate-api/ {
        proxy_pass http://172.25.90.184:31080/api/;
        proxy_set_header Host careerforge.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /index.html {
        root /usr/share/nginx/html/careerforge;
        add_header Cache-Control "no-store";
    }

    # CareerForge 前端（由 CareerMate CI 同步到 /usr/share/nginx/html/careerforge/）
    location / {
        root /usr/share/nginx/html/careerforge;
        try_files $uri $uri/ /index.html;
    }

    # CareerForge API -> Server 3 k3s NodePort via private IP
    location /api/ {
        proxy_pass http://careermate_backend/api/;
        proxy_set_header Host careerforge.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接流式（Agent messages/stream）
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# 裸 IP 访问：兼容旧路径，便于迁移期与 SkyWalking 运维入口（仅 HTTP）
